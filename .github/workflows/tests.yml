name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  logic:
    name: Game logic
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run logic tests
        run: npm test
